<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo azul UNAM con esquinas redondeadas -->
  <rect width="32" height="32" rx="6" fill="#003087"/>
  <!-- Línea de tendencia alcista (color dorado UNAM) -->
  <polyline
    points="4,25 9,19 14,21 20,12 28,7"
    stroke="#C8A800" stroke-width="2.8"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Punto de pronóstico al final -->
  <circle cx="28" cy="7" r="2.8" fill="#C8A800"/>
  <!-- Eje horizontal sutil -->
  <line x1="4" y1="27" x2="28" y2="27" stroke="rgba(200,168,0,0.35)" stroke-width="1"/>
</svg>
