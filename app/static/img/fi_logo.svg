<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 122"
     role="img" aria-label="Escudo Facultad de Ingeniería UNAM">

  <!-- ══════════════════════════════════════════════
       BANNER / CINTA  "INGENIERÍA"
       ══════════════════════════════════════════════ -->
  <!-- Sombra lateral izquierda de la cinta -->
  <path d="M15,9 L11,14 L17,18" fill="#8A6F00"/>
  <!-- Sombra lateral derecha -->
  <path d="M85,9 L89,14 L83,18" fill="#8A6F00"/>
  <!-- Cuerpo de la cinta -->
  <path d="M15,9 Q50,4 85,9 L83,18 Q50,13 17,18 Z" fill="#C8A800"/>
  <!-- Texto -->
  <text x="50" y="15.5" text-anchor="middle"
        font-size="5.6" font-weight="bold" letter-spacing="0.6"
        font-family="Arial, sans-serif" fill="#003087">INGENIERÍA</text>

  <!-- ══════════════════════════════════════════════
       ÁGUILA (silueta heráldica simplificada)
       Ala izquierda → cuerpo → cabeza → ala derecha
       ══════════════════════════════════════════════ -->

  <!-- Ala izquierda -->
  <path d="M46,37
           L5,19 L8,30
           L30,35 L18,47
           L37,43 L43,51
           Z"
        fill="white"
        stroke="rgba(200,168,0,0.35)" stroke-width="0.5"
        stroke-linejoin="round"/>

  <!-- Ala derecha (espejo) -->
  <path d="M54,37
           L95,19 L92,30
           L70,35 L82,47
           L63,43 L57,51
           Z"
        fill="white"
        stroke="rgba(200,168,0,0.35)" stroke-width="0.5"
        stroke-linejoin="round"/>

  <!-- Cuerpo -->
  <ellipse cx="50" cy="39" rx="7" ry="11"
           fill="white" stroke="rgba(200,168,0,0.35)" stroke-width="0.5"/>

  <!-- Cabeza (mira a la derecha, como en heráldica) -->
  <circle cx="58" cy="27" r="7"
          fill="white" stroke="rgba(200,168,0,0.35)" stroke-width="0.5"/>

  <!-- Pico -->
  <path d="M63,24.5 L72,27.5 L63,30.5 Z" fill="#C8A800"/>

  <!-- Ojo -->
  <circle cx="60.5" cy="26" r="1.6" fill="#003087"/>
  <circle cx="61"   cy="25.5" r="0.55" fill="white"/>

  <!-- Líneas de plumas en alas (detalle mínimo) -->
  <g stroke="rgba(200,168,0,0.45)" stroke-width="0.7" fill="none" stroke-linecap="round">
    <line x1="36" y1="35" x2="22" y2="33"/>
    <line x1="38" y1="40" x2="24" y2="40"/>
    <line x1="64" y1="35" x2="78" y2="33"/>
    <line x1="62" y1="40" x2="76" y2="40"/>
  </g>

  <!-- ══════════════════════════════════════════════
       ESCUDO HERÁLDICO
       ══════════════════════════════════════════════ -->
  <!-- Relleno blanco del escudo -->
  <path d="M26,50 L74,50 L78,69 L72,87
           Q61,101 50,106
           Q39,101 28,87
           L22,69 Z"
        fill="rgba(255,255,255,0.93)"
        stroke="white" stroke-width="2.2"/>

  <!-- Cuadrantes (rellenos sutiles) -->
  <!-- Superior izquierdo: azul claro -->
  <path d="M26,50 L50,50 L50,77 L24,77 L22,69 Z"
        fill="rgba(0,48,135,0.13)"/>
  <!-- Inferior derecho: azul claro -->
  <path d="M50,77 L75,77 L72,87 Q61,101 50,106 Z"
        fill="rgba(0,48,135,0.13)"/>
  <!-- Superior derecho: dorado muy suave -->
  <path d="M50,50 L74,50 L78,69 L75,77 L50,77 Z"
        fill="rgba(200,168,0,0.10)"/>
  <!-- Inferior izquierdo: dorado muy suave -->
  <path d="M24,77 L50,77 L50,106 Q39,101 28,87 L22,69 Z"
        fill="rgba(200,168,0,0.10)"/>

  <!-- Cruz divisoria del escudo -->
  <line x1="50"  y1="50"  x2="50"  y2="106"
        stroke="rgba(200,168,0,0.55)" stroke-width="0.9"/>
  <line x1="24"  y1="77"  x2="76"  y2="77"
        stroke="rgba(200,168,0,0.55)" stroke-width="0.9"/>

  <!-- ══════════════════════════════════════════════
       ENGRANE  (centro del escudo)
       ══════════════════════════════════════════════ -->
  <!-- Anillo exterior dorado -->
  <circle cx="50" cy="76" r="18.5"
          fill="none" stroke="#C8A800" stroke-width="2.4"/>

  <!-- Dientes del engrane (8 unidades, rotadas) -->
  <g transform="translate(50,76)" fill="#C8A800">
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(45)"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(90)"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(135)"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(180)"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(225)"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(270)"/>
    <rect x="-1.6" y="-22.5" width="3.2" height="4"   rx="0.5" transform="rotate(315)"/>
  </g>

  <!-- Relleno interior del engrane -->
  <circle cx="50" cy="76" r="15.5"
          fill="rgba(0,30,100,0.82)" stroke="#C8A800" stroke-width="0.7"/>

  <!-- Letras FI -->
  <text x="50" y="82.5" text-anchor="middle"
        font-size="16" font-weight="bold" letter-spacing="2.5"
        font-family="Georgia, 'Times New Roman', serif"
        fill="#C8A800">FI</text>

  <!-- ══════════════════════════════════════════════
       NOPALES  (izquierdo y derecho)
       ══════════════════════════════════════════════ -->

  <!-- Nopal izquierdo -->
  <g fill="none" stroke="#C8A800" stroke-width="1.4"
     stroke-linecap="round" opacity="0.82">
    <!-- Tronco -->
    <line x1="21" y1="114" x2="21" y2="95"/>
    <!-- Paleta superior izquierda -->
    <path d="M21,98 Q13,97 13,92 Q13,87 19,88"/>
    <!-- Paleta superior derecha -->
    <path d="M21,95 Q27,94 27,89 Q27,85 22,86"/>
    <!-- Elipses que dan forma a las paletas -->
    <ellipse cx="15" cy="94" rx="4.5" ry="3" transform="rotate(-38,15,94)"/>
    <ellipse cx="26" cy="90" rx="4.5" ry="3" transform="rotate(28,26,90)"/>
  </g>

  <!-- Nopal derecho -->
  <g fill="none" stroke="#C8A800" stroke-width="1.4"
     stroke-linecap="round" opacity="0.82">
    <line x1="79" y1="114" x2="79" y2="95"/>
    <path d="M79,98 Q87,97 87,92 Q87,87 81,88"/>
    <path d="M79,95 Q73,94 73,89 Q73,85 78,86"/>
    <ellipse cx="85" cy="94" rx="4.5" ry="3" transform="rotate(38,85,94)"/>
    <ellipse cx="74" cy="90" rx="4.5" ry="3" transform="rotate(-28,74,90)"/>
  </g>

  <!-- ══════════════════════════════════════════════
       LÍNEA DE BASE
       ══════════════════════════════════════════════ -->
  <path d="M8,116 Q50,122 92,116"
        stroke="#C8A800" stroke-width="0.9" fill="none" opacity="0.5"/>

</svg>
